<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Studio — Operations Board</title>
    <meta
      name="description"
      content="A single-screen task board: To Do, In Progress, Done. Move cards with a button or a drag — no reload. Front-end demo."
    />
    <meta property="og:title" content="Meridian Studio — Operations Board" />
    <meta
      property="og:description"
      content="A single-screen task board: To Do, In Progress, Done. Move cards with a button or a drag — no reload. Front-end demo."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#fbfaf8" />

    <script>
      // Set the theme before first paint so there's no flash.
      try {
        var stored = localStorage.getItem('meridian.theme')
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
